<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소크라테스 선생님과 함께하는 분수의 곱셈 (5학년)</title>
<style>
:root{--pri:#2563eb;--pri2:#dbeafe;--bg:#f5f7fb;--fg:#1f2937;--line:#d1d5db;--ok:#16a34a;--hint:#f59e0b;--shown:#ef4444;}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .sub{font-size:13px;color:#6b7280}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:#1d4ed8}
.wrap{display:flex;height:calc(100vh - 58px)}
aside{width:300px;background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto;flex-shrink:0}
aside h3{font-size:14px;margin:6px 0 8px}
.prog{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:4px 0 4px}
.prog>div{height:100%;background:var(--pri);width:0}
.progtxt{font-size:12px;color:#6b7280;margin-bottom:12px}
.tabs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tab{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;font-size:14px;display:flex;justify-content:space-between}
.tab.on{border-color:var(--pri);background:var(--pri2);font-weight:700}
.tab small{color:#6b7280;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 0;cursor:pointer;font-size:14px;font-family:inherit}
.cell.perfect{background:#dcfce7;border-color:var(--ok)}
.cell.hint{background:#fef3c7;border-color:var(--hint)}
.cell.shown{background:#fee2e2;border-color:var(--shown)}
.cell.cur{outline:3px solid var(--pri)}
.legend{font-size:12px;color:#4b5563;margin-top:10px;line-height:1.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;border:1px solid #999}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow:auto;padding:18px}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.bub{max-width:75%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;line-height:1.9;font-size:16px}
.msg.user .bub{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:#fff;border:2px solid var(--pri);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:22px;text-align:center}
.card .lab{font-size:13px;color:#6b7280;display:block;margin-bottom:4px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15;font-size:.92em}
.fr .nu{border-bottom:2px solid currentColor;padding:0 3px}
.fr .de{padding:0 3px}
.mx{display:inline-flex;align-items:center;white-space:nowrap}
#quick{padding:0 18px 8px;display:flex;gap:8px;flex-wrap:wrap}
#quick .btn{font-size:15px;border-color:var(--pri);color:var(--pri)}
#quick .btn.pri{color:#fff}
.inbar{border-top:1px solid var(--line);background:#fff;padding:10px 14px}
.inrow{display:flex;gap:8px}
#inp{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
#inp:focus{outline:2px solid var(--pri)}
.tools{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:#6b7280}
.tools .btn{padding:4px 10px;font-size:13px}
#preview{margin-left:auto;font-size:16px;color:var(--fg);min-height:30px}
.typing{color:#9ca3af;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.ov.hide{display:none}
.box{background:#fff;border-radius:12px;padding:22px;width:min(520px,92vw);max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:20px}
.box p{line-height:1.7;margin:6px 0}
.box input{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:10px 0;font-family:inherit}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:#f3f4f6}
svg{display:block;margin:6px 0}
small.g{color:#6b7280}
@media (max-width:800px){.wrap{flex-direction:column;height:auto}aside{width:100%;border-right:0;border-bottom:1px solid var(--line)}main{height:80vh}.bub{max-width:88%}}
@media print{aside,.inbar,#quick,header .btn{display:none}}
</style>
</head>
<body>
<header>
  <h1>소크라테스 선생님과 분수의 곱셈</h1>
  <span class="sub">5학년 · 질문을 따라 스스로 답을 찾아요</span>
  <span class="sp"></span>
  <span id="who" class="sub"></span>
  <button class="btn" onclick="showResult()">학습 결과</button>
  <button class="btn" onclick="resetAll()">기록 초기화</button>
</header>
<div class="wrap">
  <aside>
    <h3>전체 진행</h3>
    <div class="prog"><div id="pbar"></div></div>
    <div class="progtxt" id="ptxt"></div>
    <h3>문제 유형</h3>
    <div class="tabs" id="tabs"></div>
    <h3 id="gridTitle">문제 선택</h3>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span class="dot" style="background:#dcfce7;border-color:#16a34a"></span>스스로 해결
      <span class="dot" style="background:#fef3c7;border-color:#f59e0b;margin-left:8px"></span>힌트 후 해결<br>
      <span class="dot" style="background:#fee2e2;border-color:#ef4444"></span>선생님 설명 들음
      <span class="dot" style="background:#fff;margin-left:8px"></span>아직 안 풂
    </div>
    <div style="margin-top:12px;display:flex;gap:6px">
      <button class="btn" style="flex:1" onclick="randomProblem()">무작위 문제</button>
      <button class="btn" style="flex:1" onclick="nextUnsolved()">안 푼 문제</button>
    </div>
  </aside>
  <main>
    <div id="chat"></div>
    <div id="quick"></div>
    <div class="inbar">
      <div class="inrow">
        <input id="inp" placeholder="답을 입력하세요 (예: 6, 3/4, 1 1/2)" autocomplete="off">
        <button class="btn pri" onclick="send()">보내기</button>
      </div>
      <div class="tools">
        <button class="btn" onclick="ins('/')">분수 기호 /</button>
        <button class="btn" onclick="ins(' ')">대분수 띄어쓰기</button>
        <button class="btn" onclick="askHint()">힌트 주세요</button>
        <span>입력 예: 3/4 → <span class="fr"><span class="nu">3</span><span class="de">4</span></span>, 1 1/2 → 1<span class="fr"><span class="nu">1</span><span class="de">2</span></span></span>
        <span id="preview"></span>
      </div>
    </div>
  </main>
</div>

<div class="ov" id="nameOv">
  <div class="box">
    <h2>반가워요!</h2>
    <p>저는 <b>소크라테스 선생님</b>이에요. 정답을 바로 알려주지 않고, <b>질문</b>을 하면서 여러분이 스스로 답을 찾도록 도와줄 거예요.</p>
    <p>이름(또는 별명)을 알려 줄래요?</p>
    <input id="nameInp" placeholder="이름 입력" maxlength="12">
    <button class="btn pri" style="width:100%" onclick="setName()">시작하기</button>
  </div>
</div>
<div class="ov hide" id="resOv">
  <div class="box" id="resBox"></div>
</div>

<script>
/* ---------- 기본 도구 ---------- */
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
function rng(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(res => setTimeout(res, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fr(n, d) {
  return '<span class="fr"><span class="nu">' + n + '</span><span class="de">' + d + '</span></span>';
}
function mx(w, n, d) {
  return '<span class="mx">' + w + fr(n, d) + '</span>';
}
function valHTML(n, d) {
  const g = gcd(n, d);
  const rn = n / g;
  const rd = d / g;
  if (rd === 1) return String(rn);
  if (rn > rd) return mx(Math.floor(rn / rd), rn % rd, rd);
  return fr(rn, rd);
}

/* ---------- 문제 은행 (유형별 20문항, 고정) ---------- */
const TYPES = [
  { id: 1, name: "(분수) × (자연수)" },
  { id: 2, name: "(자연수) × (분수)" },
  { id: 3, name: "(진분수) × (진분수)" },
  { id: 4, name: "(대분수) × (대분수)" }
];
function genFN(seed) {
  const r = rng(seed);
  const out = [];
  const seen = new Set();
  while (out.length < 20) {
    const b = ri(r, 2, 9);
    const a = ri(r, 1, b - 1);
    const n = ri(r, 2, 9);
    if (gcd(a, b) !== 1) continue;
    const k = a + "/" + b + "x" + n;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ a: a, b: b, n: n });
  }
  return out;
}
function genPP(seed) {
  const r = rng(seed);
  const out = [];
  const seen = new Set();
  while (out.length < 20) {
    const b = ri(r, 2, 8);
    const d = ri(r, 2, 8);
    let a = 1;
    let c = 1;
    if (out.length >= 5) {
      a = ri(r, 1, b - 1);
      c = ri(r, 1, d - 1);
      if (a === 1 && c === 1) continue;
    }
    if (gcd(a, b) !== 1 || gcd(c, d) !== 1) continue;
    const k = a + "/" + b + "x" + c + "/" + d;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ a: a, b: b, c: c, d: d });
  }
  return out;
}
function genMM(seed) {
  const r = rng(seed);
  const out = [];
  const seen = new Set();
  while (out.length < 20) {
    const A = ri(r, 1, 3);
    const C = ri(r, 1, 3);
    const b = ri(r, 2, 6);
    const d = ri(r, 2, 6);
    const a = ri(r, 1, b - 1);
    const c = ri(r, 1, d - 1);
    if (gcd(a, b) !== 1 || gcd(c, d) !== 1) continue;
    const k = A + "_" + a + "/" + b + "x" + C + "_" + c + "/" + d;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ A: A, a: a, b: b, C: C, c: c, d: d });
  }
  return out;
}
const BANK = { 1: genFN(101), 2: genFN(202), 3: genPP(303), 4: genMM(404) };

function probHTML(t, p) {
  if (t === 1) return fr(p.a, p.b) + " × " + p.n;
  if (t === 2) return p.n + " × " + fr(p.a, p.b);
  if (t === 3) return fr(p.a, p.b) + " × " + fr(p.c, p.d);
  return mx(p.A, p.a, p.b) + " × " + mx(p.C, p.c, p.d);
}

/* ---------- 마지막 단계(기약분수·대분수) 공통 ---------- */
function hintsFinal(n, d) {
  const g = gcd(n, d);
  const rn = n / g;
  const rd = d / g;
  const h = [];
  if (g > 1) {
    h.push("분자 " + n + "과(와) 분모 " + d + "를 <b>함께 나눌 수 있는 수</b>가 있을까요? 두 수의 최대공약수는 얼마일까요?");
    h.push(n + "과(와) " + d + "를 모두 <b>" + g + "</b>(으)로 나누면 어떤 분수가 될까요?");
  }
  if (rd !== 1 && rn > rd) {
    h.push("분자가 분모보다 크네요. " + fr(rd, rd) + " = 1이에요. " + rn + " 안에 " + rd + "가 몇 번 들어가고, 얼마가 남을까요? 그것을 대분수로 써 볼까요?");
  }
  if (rd === 1 && g > 1) {
    h.push("분자를 분모로 나누면 나누어떨어지나요? 그렇다면 자연수로 나타낼 수 있겠죠?");
  }
  if (h.length === 0) {
    h.push("분자와 분모를 함께 나눌 수 있는 수(1 말고)가 있나요? 없다면 이미 가장 간단한 분수예요.");
    h.push("지금 분수 " + fr(n, d) + "를 그대로 답으로 써 보면 어떨까요?");
  }
  return h;
}
function explainFinal(n, d) {
  const g = gcd(n, d);
  const rn = n / g;
  const rd = d / g;
  const parts = [fr(n, d)];
  if (g > 1) parts.push(rd === 1 ? String(rn) : fr(rn, rd));
  if (rd !== 1 && rn > rd) parts.push(mx(Math.floor(rn / rd), rn % rd, rd));
  if (parts.length === 1) return fr(n, d) + "는 이미 기약분수예요. 답은 <b>" + valHTML(n, d) + "</b>예요.";
  return parts.join(" = ") + " 이므로 답은 <b>" + valHTML(n, d) + "</b>예요.";
}
function finalStep(n, d, q) {
  return {
    kind: "final",
    q: q || ("지금까지 구한 값은 " + fr(n, d) + "예요. 이것을 <b>가장 간단한 분수(기약분수)</b>로 나타내고, 1보다 크면 <b>대분수</b>나 <b>자연수</b>로 써 볼까요?"),
    val: [n, d],
    hints: hintsFinal(n, d),
    explain: explainFinal(n, d)
  };
}

/* ---------- 넓이 모델 그림 ---------- */
function areaSVG(a, b, c, d) {
  const W = 220;
  const H = 150;
  const cw = W / b;
  const ch = H / d;
  let s = '<svg width="' + (W + 2) + '" height="' + (H + 2) + '" viewBox="-1 -1 ' + (W + 2) + " " + (H + 2) + '">';
  for (let i = 0; i < b; i++) {
    for (let j = 0; j < d; j++) {
      let fill = "#ffffff";
      const inA = i < a;
      const inC = j < c;
      if (inA && inC) fill = "#2563eb";
      else if (inA) fill = "#bfdbfe";
      else if (inC) fill = "#fde68a";
      s += '<rect x="' + i * cw + '" y="' + j * ch + '" width="' + cw + '" height="' + ch + '" fill="' + fill + '" stroke="#374151" stroke-width="1"/>';
    }
  }
  s += "</svg>";
  s += '<small class="g">파란 세로줄: ' + fr(a, b) + " · 노란 가로줄: " + fr(c, d) + " · 진한 파랑: 겹친 부분</small>";
  return s;
}

/* ---------- 유형별 소크라테스식 질문 단계 ---------- */
function buildSteps(t, p) {
  const S = [];
  let reflect = "";
  let ans = [0, 1];
  if (t === 1) {
    const P = p.a * p.n;
    ans = [P, p.b];
    S.push({
      kind: "choice",
      q: fr(p.a, p.b) + " × " + p.n + "은(는) " + fr(p.a, p.b) + "를 " + p.n + "번 더한 것과 같아요.<br>분모가 같은 분수끼리 더하면 <b>분모</b>는 어떻게 될까요?",
      choices: ["분모는 그대로예요", "분모끼리도 더해져요"],
      correct: 0,
      hints: [
        fr(1, 4) + " + " + fr(1, 4) + "를 떠올려 볼까요? 피자를 4조각으로 나눈 것 중 1조각과 1조각을 모으면, <b>조각의 크기</b>가 바뀌나요?",
        "조각의 크기(분모)는 그대로이고, 조각의 <b>개수</b>(분자)만 늘어나요. 그렇다면 분모는 어떻게 될까요?"
      ],
      ok: "조각의 크기는 변하지 않으니까 분모는 그대로예요.",
      explain: "분모가 같은 분수를 더할 때 분모는 그대로이고, 분자만 더해요."
    });
    S.push({
      kind: "num",
      q: "그렇다면 자연수 " + p.n + "은(는) <b>분자</b>에 곱하면 되겠네요. 분자 " + p.a + " × " + p.n + "은(는) 얼마일까요?",
      ans: P,
      diag: { [p.a + p.n]: "혹시 " + p.a + "와(과) " + p.n + "을(를) 더했나요? 지금은 <b>곱셈</b>이에요." },
      hints: [
        p.a + "를 " + p.n + "번 더해 보세요: " + Array(p.n).fill(p.a).join(" + ") + " = ?",
        "구구단 " + p.a + "단을 떠올려 볼까요? " + p.a + " × " + p.n + " = ?"
      ],
      ok: "그래서 " + fr(p.a, p.b) + " × " + p.n + " = " + fr(p.a + " × " + p.n, p.b) + " = " + fr(P, p.b) + "가 돼요.",
      explain: p.a + " × " + p.n + " = " + P + "이에요. 그래서 " + fr(P, p.b) + "가 돼요."
    });
    S.push(finalStep(P, p.b));
    if (gcd(p.b, p.n) > 1) {
      reflect = "생각해 보기: 곱하기 전에 분모 " + p.b + "와(과) 자연수 " + p.n + "을(를) <b>먼저 약분</b>했다면 계산이 더 쉬워지지 않았을까요? 다음 문제에서 한번 시도해 보세요.";
    } else {
      reflect = "생각해 보기: 분수에 자연수를 곱했을 때, 왜 분모는 그대로이고 분자만 바뀌는지 친구에게 설명해 볼 수 있나요?";
    }
  }
  if (t === 2) {
    const P = p.n * p.a;
    ans = [P, p.b];
    S.push({
      kind: "choice",
      q: p.n + " × " + fr(p.a, p.b) + "는 <b>\"" + p.n + "의 " + fr(p.a, p.b) + "\"</b>라는 뜻이에요.<br>계산하기 전에 예상해 볼까요? 결과는 " + p.n + "보다 클까요, 작을까요?",
      choices: [p.n + "보다 커요", p.n + "보다 작아요", p.n + "와(과) 같아요"],
      correct: 1,
      hints: [
        fr(p.a, p.b) + "는 1보다 큰가요, 작은가요? 1보다 작은 수를 곱한다는 건 " + p.n + "의 <b>일부만</b> 가져온다는 뜻이에요.",
        "예를 들어 10의 " + fr(1, 2) + "(절반)은 5예요. 10보다 커졌나요, 작아졌나요?"
      ],
      ok: "1보다 작은 분수를 곱하면 처음 수보다 작아져요. 이 예상을 마지막에 확인해 봐요.",
      explain: fr(p.a, p.b) + "는 1보다 작으므로 " + p.n + "에 곱하면 " + p.n + "보다 작아져요."
    });
    if (p.n % p.b === 0) {
      const u = p.n / p.b;
      S.push({
        kind: "num",
        q: "먼저 " + p.n + "의 " + fr(1, p.b) + "를 구해 볼까요? " + p.n + "을(를) 똑같이 " + p.b + "묶음으로 나누면 한 묶음은 얼마일까요?",
        ans: u,
        hints: [
          p.n + "개의 사탕을 " + p.b + "명이 똑같이 나누어 가지면 한 명이 몇 개씩 가질까요?",
          p.n + " ÷ " + p.b + " = ?"
        ],
        ok: p.n + "의 " + fr(1, p.b) + "는 " + u + "이에요.",
        explain: p.n + " ÷ " + p.b + " = " + u + "이므로 " + p.n + "의 " + fr(1, p.b) + "는 " + u + "이에요."
      });
      S.push(finalStep(P, p.b, fr(p.a, p.b) + "는 " + fr(1, p.b) + "가 <b>" + p.a + "개</b> 모인 것이에요. 그렇다면 " + p.n + "의 " + fr(p.a, p.b) + "는 얼마일까요?"));
    } else {
      S.push({
        kind: "num",
        q: p.n + " × " + fr(p.a, p.b) + " = " + fr(p.n + " × " + p.a, p.b) + "처럼 자연수를 <b>분자</b>에 곱할 수 있어요. " + p.n + " × " + p.a + "는 얼마일까요?",
        ans: P,
        diag: { [p.n + p.a]: "혹시 더했나요? 지금은 <b>곱셈</b>이에요." },
        hints: [
          p.a + "를 " + p.n + "번 더한 것과 같아요. 몇이 될까요?",
          "구구단으로 생각해 볼까요? " + p.n + " × " + p.a + " = ?"
        ],
        ok: "그래서 " + fr(P, p.b) + "가 돼요.",
        explain: p.n + " × " + p.a + " = " + P + "이므로 " + fr(P, p.b) + "가 돼요."
      });
      S.push(finalStep(P, p.b));
    }
    reflect = "생각해 보기: 처음에 예상한 대로 답이 " + p.n + "보다 작아졌나요? 답 " + valHTML(P, p.b) + "와(과) " + p.n + "을(를) 비교해 보세요.";
  }
  if (t === 3) {
    const N = p.a * p.c;
    const D = p.b * p.d;
    ans = [N, D];
    S.push({
      kind: "choice",
      q: fr(p.a, p.b) + " × " + fr(p.c, p.d) + "는 <b>\"" + fr(p.a, p.b) + "의 " + fr(p.c, p.d) + "\"</b>예요. 결과는 " + fr(p.a, p.b) + "보다 클까요, 작을까요?",
      choices: ["더 커요", "더 작아요"],
      correct: 1,
      hints: [
        fr(p.c, p.d) + "는 1보다 작은 수예요. 어떤 양의 일부만 가져오면 커질까요, 작아질까요?",
        fr(1, 2) + "의 " + fr(1, 2) + "(절반의 절반)를 떠올려 보세요. 처음보다 커졌나요?"
      ],
      ok: "진분수를 곱하면 처음 수보다 작아져요.",
      explain: fr(p.c, p.d) + "는 1보다 작으므로 곱하면 " + fr(p.a, p.b) + "보다 작아져요."
    });
    S.push({
      kind: "num",
      q: "그림으로 생각해 볼까요? 전체(1)를 세로로 " + p.b + "칸, 가로로 " + p.d + "줄로 나누었어요.<br>" + areaSVG(p.a, p.b, p.c, p.d) + "전체는 모두 몇 칸으로 나누어졌을까요?",
      ans: D,
      diag: { [p.b + p.d]: "혹시 " + p.b + "와(과) " + p.d + "를 더했나요? 한 줄에 " + p.b + "칸씩 " + p.d + "줄이 있어요." },
      hints: [
        "한 줄에 " + p.b + "칸씩, " + p.d + "줄이 있어요. 곱셈으로 생각해 볼까요?",
        p.b + " × " + p.d + " = ?"
      ],
      ok: "전체 칸 수 " + D + "이(가) 새로운 <b>분모</b>가 돼요. 분모끼리 곱한 것과 같죠?",
      explain: p.b + " × " + p.d + " = " + D + "칸이에요. 이것이 새로운 분모가 돼요."
    });
    S.push({
      kind: "num",
      q: "진한 파란색(겹친 부분)은 " + fr(p.a, p.b) + "의 " + fr(p.c, p.d) + "를 나타내요. 겹친 칸은 몇 칸일까요?",
      ans: N,
      hints: [
        "겹친 부분은 세로줄 " + p.a + "칸과 가로줄 " + p.c + "줄이 만나는 곳이에요. 몇 × 몇일까요?",
        p.a + " × " + p.c + " = ?"
      ],
      ok: "그래서 " + fr(p.a, p.b) + " × " + fr(p.c, p.d) + " = " + fr(p.a + " × " + p.c, p.b + " × " + p.d) + " = " + fr(N, D) + "예요. <b>분자는 분자끼리, 분모는 분모끼리</b> 곱한 것과 같네요!",
      explain: p.a + " × " + p.c + " = " + N + "칸이에요. 그래서 " + fr(N, D) + "가 돼요."
    });
    S.push(finalStep(N, D));
    reflect = "생각해 보기: 그림을 그리지 않고도 답을 구하는 규칙을 한 문장으로 말해 볼 수 있나요? (분자는 ○○끼리, 분모는 ○○끼리)";
  }
  if (t === 4) {
    const I1 = p.A * p.b + p.a;
    const I2 = p.C * p.d + p.c;
    const N = I1 * I2;
    const D = p.b * p.d;
    ans = [N, D];
    S.push({
      kind: "choice",
      q: mx(p.A, p.a, p.b) + " × " + mx(p.C, p.c, p.d) + "를 계산하려고 해요. 어떤 방법이 좋을까요?",
      choices: ["대분수를 가분수로 바꾸어 곱한다", "자연수끼리, 분수끼리 따로 곱해서 더한다"],
      correct: 0,
      hints: [
        mx(1, 1, 2) + " × " + mx(1, 1, 2) + "로 확인해 볼까요? " + mx(1, 1, 2) + "의 " + mx(1, 1, 2) + "배는 " + mx(1, 1, 2) + "보다 커야 해요. 그런데 따로 곱해서 더하면 1×1 + " + fr(1, 2) + "×" + fr(1, 2) + " = " + mx(1, 1, 4) + "로 오히려 작아져요. 어느 방법을 믿을 수 있을까요?",
        "대분수를 <b>하나의 분수(가분수)</b>로 바꾸면, 진분수의 곱셈처럼 분자끼리·분모끼리 곱할 수 있어요."
      ],
      ok: "가분수로 바꾸면 진분수의 곱셈과 같은 방법으로 계산할 수 있어요.",
      explain: "자연수끼리, 분수끼리 따로 곱하면 빠지는 부분이 생겨요. 대분수는 가분수로 바꾸어 곱해요."
    });
    S.push({
      kind: "frac",
      improper: true,
      q: mx(p.A, p.a, p.b) + "를 <b>가분수</b>로 바꾸면 얼마일까요? (예: 7/4)",
      val: [I1, p.b],
      hints: [
        "1 = " + fr(p.b, p.b) + "이에요. 그러면 자연수 " + p.A + "는 " + fr("?", p.b) + "일까요?",
        p.A + " = " + fr(p.A * p.b, p.b) + "이에요. 여기에 " + fr(p.a, p.b) + "를 더하면?"
      ],
      ok: mx(p.A, p.a, p.b) + " = " + fr(I1, p.b),
      explain: p.A + " × " + p.b + " + " + p.a + " = " + I1 + "이므로 " + mx(p.A, p.a, p.b) + " = " + fr(I1, p.b) + "예요."
    });
    S.push({
      kind: "frac",
      improper: true,
      q: "좋아요. 그럼 " + mx(p.C, p.c, p.d) + "도 가분수로 바꾸어 볼까요?",
      val: [I2, p.d],
      hints: [
        "1 = " + fr(p.d, p.d) + "이에요. 자연수 " + p.C + "는 " + fr("?", p.d) + "일까요?",
        p.C + " = " + fr(p.C * p.d, p.d) + "이에요. 여기에 " + fr(p.c, p.d) + "를 더하면?"
      ],
      ok: mx(p.C, p.c, p.d) + " = " + fr(I2, p.d),
      explain: p.C + " × " + p.d + " + " + p.c + " = " + I2 + "이므로 " + mx(p.C, p.c, p.d) + " = " + fr(I2, p.d) + "예요."
    });
    S.push({
      kind: "frac",
      skipFinal: true,
      q: "이제 " + fr(I1, p.b) + " × " + fr(I2, p.d) + "를 계산해 볼까요? 분자끼리, 분모끼리 곱하면 얼마일까요? (약분하지 않아도 괜찮아요)",
      val: [N, D],
      hints: [
        "분자끼리: " + I1 + " × " + I2 + " = ? , 분모끼리: " + p.b + " × " + p.d + " = ?",
        "분자는 " + N + "이에요. 분모 " + p.b + " × " + p.d + "는 얼마일까요?"
      ],
      ok: "잘 곱했어요!",
      explain: fr(I1 + " × " + I2, p.b + " × " + p.d) + " = " + fr(N, D) + "예요."
    });
    S.push(finalStep(N, D));
    reflect = "생각해 보기: 답이 " + p.A + " × " + p.C + " = " + p.A * p.C + "보다 크고, " + (p.A + 1) + " × " + (p.C + 1) + " = " + (p.A + 1) * (p.C + 1) + "보다 작은가요? 어림으로 답을 확인하는 습관을 길러 봐요.";
  }
  return { steps: S, reflect: reflect, ans: ans };
}

/* ---------- 답 해석 ---------- */
function parseAns(s) {
  s = String(s)
    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 65248))
    .replace(/(\d+)\s*분의\s*(\d+)/g, "$2/$1")
    .replace(/과|와|하고/g, " ")
    .replace(/\s*\/\s*/g, "/")
    .replace(/\s+/g, " ")
    .trim();
  let m = s.match(/^(\d+) (\d+)\/(\d+)$/);
  if (m) {
    const w = +m[1], n = +m[2], d = +m[3];
    if (!d) return null;
    return { kind: "mixed", w: w, n: n, d: d, num: w * d + n, den: d };
  }
  m = s.match(/^(\d+)\/(\d+)$/);
  if (m) {
    const n = +m[1], d = +m[2];
    if (!d) return null;
    return { kind: "frac", n: n, d: d, num: n, den: d };
  }
  m = s.match(/^(\d+)$/);
  if (m) return { kind: "int", num: +m[1], den: 1 };
  return null;
}
function isReduced(p) {
  if (p.kind === "int") return true;
  if (p.kind === "frac") return p.d !== 1 && gcd(p.n, p.d) === 1;
  return p.n > 0 && p.n < p.d && gcd(p.n, p.d) === 1;
}
const eqv = (p, v) => p.num * v[1] === v[0] * p.den;
const norm = s => String(s).replace(/\s/g, "");

const chat = document.getElementById("chat");

let cur = null;
let busy = false;

function addMsg(who, html) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "bot") d.innerHTML = '<div class="av">🦉</div><div class="bub">' + html + "</div>";
  else d.innerHTML = '<div class="bub">' + html + "</div>";

}
async function bot(html, wait) {
  const t = document.createElement("div");
  t.className = "msg bot";
  t.innerHTML = '<div class="av">🦉</div><div class="bub typing">생각하는 중...</div>';
  chat.appendChild(t);

  addMsg("bot", html);

function setQuick(items) {
  quick.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "btn" + (it.pri ? " pri" : "");
    b.innerHTML = it.label;
    b.onclick = it.fn;
    quick.appendChild(b);
  });
}

function renderSide() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  TYPES.forEach(T => {
    const done = BANK[T.id].filter((_, i) => store.res[T.id + "-" + i]).length;
    const b = document.createElement("button");
    b.className = "tab" + (T.id === curType ? " on" : "");
    b.innerHTML = "<span>" + T.id + ". " + T.name + "</span><small>" + done + "/20</small>";
    b.onclick = () => { curType = T.id; renderSide(); };
    tabs.appendChild(b);
  });
  document.getElementById("gridTitle").textContent = TYPES[curType - 1].name + " 문제";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  BANK[curType].forEach((p, i) => {
    const b = document.createElement("button");
    const st = store.res[curType + "-" + i] || "";
    b.className = "cell " + st + (cur && cur.t === curType && cur.i === i ? " cur" : "");
    b.textContent = i + 1;
    b.onclick = () => startProblem(curType, i);

  });

  document.getElementById("ptxt").textContent = "80문항 중 " + total + "문항 완료";

}

async function startProblem(t, i) {
  if (busy) return;
  busy = true;
  curType = t;
  const p = BANK[t][i];
  const built = buildSteps(t, p);
  cur = { t: t, i: i, p: p, steps: built.steps, reflect: built.reflect, ans: built.ans, si: 0, tries: 0, mistake: false, hinted: false, shown: false, done: false };
  renderSide();
  chat.innerHTML = '<div class="card"><span class="lab">' + TYPES[t - 1].name + " · " + (i + 1) + "번 문제</span>" + probHTML(t, p) + " = ?</div>";
  setQuick([]);
  await bot(pick(["함께 생각해 볼까요? 답을 바로 구하기보다 질문에 하나씩 답해 봐요.", "좋아요, 이 문제를 질문으로 풀어 봐요.", "천천히 생각해도 괜찮아요. 첫 번째 질문이에요."]), 300);
  await ask();
  busy = false;
  inp.focus();
}
async function ask() {
  const st = cur.steps[cur.si];
  await bot("<b>질문 " + (cur.si + 1) + "/" + cur.steps.length + "</b><br>" + st.q);
  if (st.kind === "choice") {
    setQuick(st.choices.map((c, k) => ({ label: c, fn: () => answer(c, k) })));
  } else {
    setQuick([{ label: "힌트 주세요", fn: askHint }, { label: "잘 모르겠어요", fn: () => answer("잘 모르겠어요", null, true) }]);
  }
}
function send() {
  const v = inp.value.trim();
  if (!v) return;
  inp.value = "";
  updPreview();
  answer(v);
}
async function answer(text, choiceIdx, dunno) {
  if (busy) return;
  if (!cur || cur.done) {
    addMsg("user", esc(text));
    await bot("왼쪽에서 문제를 골라 주세요. 또는 아래 버튼을 눌러 시작할 수 있어요.");
    return;
  }
  busy = true;
  const st = cur.steps[cur.si];
  addMsg("user", esc(text));
  if (dunno) {
    await wrong(st, "괜찮아요, 모르는 것을 아는 것도 배움의 시작이에요.");
    busy = false;
    return;
  }
  let result = "wrong";
  let msg = "";
  let parsed = null;
  if (st.kind === "choice") {
    let idx = choiceIdx;
    if (idx === undefined || idx === null) {
      const t = norm(text);
      idx = st.choices.findIndex(c => norm(c) === t || (t.length >= 2 && norm(c).indexOf(t) >= 0));
    }
    if (idx < 0) { result = "format"; msg = "아래 버튼 중에서 골라 볼까요?"; }
    else result = idx === st.correct ? "ok" : "wrong";
  } else if (st.kind === "num") {
    const t = norm(text);
    if (!/^\d+$/.test(t)) { result = "format"; msg = "이 질문은 <b>자연수</b>로 답해 볼까요? (예: 12)"; }
    else {
      const v = +t;
      if (v === st.ans) result = "ok";
      else { result = "wrong"; if (st.diag && st.diag[v]) msg = st.diag[v]; }
    }
  } else {
    parsed = parseAns(text);
    if (!parsed) { result = "format"; msg = "분수는 <b>3/4</b>, 대분수는 <b>1 1/2</b>처럼 띄어 쓰고, 자연수는 숫자만 써 주세요."; }
    else if (st.kind === "frac" && st.improper && parsed.kind !== "frac") {
      result = eqv(parsed, st.val) ? "format" : "wrong";
      if (result === "format") msg = "값은 같아요! 그런데 이번에는 <b>가분수</b>(분자가 분모보다 큰 분수, 예: 7/4)로 써 볼까요?";
    } else if (!eqv(parsed, st.val)) result = "wrong";
    else if (st.kind === "final" && !isReduced(parsed)) {
      result = "format";
      const g = parsed.kind === "mixed" ? gcd(parsed.n, parsed.d) : gcd(parsed.num, parsed.den);
      msg = "값은 맞았어요! 그런데 더 간단하게 나타낼 수 있지 않을까요? " + (g > 1 ? "분자와 분모를 함께 나눌 수 있는 수가 남아 있는지 살펴보세요." : "분모가 1이면 어떻게 쓰는 게 좋을까요? 대분수의 분수 부분이 1보다 작은지도 확인해 보세요.");
    } else result = "ok";
  }
  if (result === "format") {
    await bot(msg);
  } else if (result === "ok") {
    const praise = pick(["맞아요!", "정확해요!", "훌륭해요!", "좋은 생각이에요!", "바로 그거예요!"]);
    let extra = st.ok ? " " + st.ok : "";
    if (st.kind === "final" && parsed && parsed.kind === "frac" && parsed.n > parsed.d) {
      extra += " 대분수로 쓰면 " + valHTML(st.val[0], st.val[1]) + "이에요.";
    }
    await bot(praise + extra);
    if (st.skipFinal && parsed && isReduced(parsed)) {
      await bot("벌써 약분까지 해서 가장 간단한 형태로 답했네요!");
      cur.si = cur.steps.length;
      await finish();
    } else {
      await nextStep();
    }
  } else {
    await wrong(st, msg);
  }
  busy = false;
  inp.focus();
}
async function wrong(st, pre) {
  cur.tries++;
  cur.mistake = true;
  if (cur.tries <= st.hints.length) {
    const lead = pick(["음, 다시 한번 생각해 볼까요?", "아쉬워요. 이렇게 생각해 보면 어떨까요?", "거의 다 왔어요! 질문 하나 할게요."]);
    await bot((pre ? pre + "<br>" : "") + lead + "<br>" + st.hints[cur.tries - 1]);
  } else {
    cur.shown = true;
    await bot((pre ? pre + "<br>" : "") + "함께 정리해 볼까요?<br>" + st.explain);
    await nextStep();
  }
}
async function askHint() {
  if (busy || !cur || cur.done) return;
  busy = true;
  const st = cur.steps[cur.si];
  addMsg("user", "힌트 주세요");
  cur.tries++;
  cur.hinted = true;
  if (cur.tries <= st.hints.length) {
    await bot("힌트 질문이에요.<br>" + st.hints[cur.tries - 1]);
  } else {
    cur.shown = true;
    await bot("이번에는 같이 정리해 볼게요.<br>" + st.explain);
    await nextStep();
  }
  busy = false;
}
async function nextStep() {
  cur.si++;
  cur.tries = 0;
  if (cur.si >= cur.steps.length) await finish();
  else await ask();
}
async function finish() {
  cur.done = true;
  const status = cur.shown ? "shown" : (cur.mistake || cur.hinted ? "hint" : "perfect");
  const key = cur.t + "-" + cur.i;
  const order = { perfect: 3, hint: 2, shown: 1 };
  if (!store.res[key] || order[status] >= order[store.res[key]]) store.res[key] = status;
  save();
  renderSide();
  const msgs = {
    perfect: "질문마다 스스로 답을 찾았어요. 정말 대단해요!",
    hint: "힌트 질문을 실마리로 끝까지 해결했어요. 생각하는 힘이 자라고 있어요!",
    shown: "오늘은 선생님과 함께 정리했어요. 같은 문제를 다시 풀어 보면 이번엔 스스로 할 수 있을 거예요."
  };
  await bot("<b>정리</b>: " + probHTML(cur.t, cur.p) + " = <b>" + valHTML(cur.ans[0], cur.ans[1]) + "</b><br>" + msgs[status]);
  if (cur.reflect) await bot(cur.reflect);
  setQuick([
    { label: "다음 문제", pri: true, fn: () => goNext() },
    { label: "이 문제 다시 풀기", fn: () => startProblem(cur.t, cur.i) },
    { label: "안 푼 문제로", fn: nextUnsolved }
  ]);
}
function goNext() {
  let t = cur.t, i = cur.i + 1;
  if (i >= 20) { i = 0; t = t % 4 + 1; }
  startProblem(t, i);
}
function nextUnsolved() {
  const ts = [curType, 1, 2, 3, 4];
  for (const t of ts) {
    for (let i = 0; i < 20; i++) {
      if (!store.res[t + "-" + i]) { startProblem(t, i); return; }
    }
  }
  bot("80문항을 모두 풀었어요! 노란색·빨간색 문제를 다시 풀어 스스로 해결해 보세요.");
}
function randomProblem() {
  startProblem(1 + Math.floor(Math.random() * 4), Math.floor(Math.random() * 20));
}
function ins(ch) {
  const s = inp.selectionStart || inp.value.length;
  inp.value = inp.value.slice(0, s) + ch + inp.value.slice(s);
  inp.focus();
  inp.selectionStart = inp.selectionEnd = s + 1;
  updPreview();
}
function updPreview() {
  const p = parseAns(inp.value);
  const el = document.getElementById("preview");
  if (!inp.value.trim() || !p) { el.innerHTML = ""; return; }
  if (p.kind === "mixed") el.innerHTML = "미리보기: " + mx(p.w, p.n, p.d);
  else if (p.kind === "frac") el.innerHTML = "미리보기: " + fr(p.n, p.d);
  else el.innerHTML = "미리보기: " + p.num;
}
inp.addEventListener("input", updPreview);
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send(); }
});

function setName() {
  const v = document.getElementById("nameInp").value.trim();
  if (!v) { document.getElementById("nameInp").focus(); return; }
  store.name = v;
  save();
  document.getElementById("nameOv").classList.add("hide");
  welcome();
}
document.getElementById("nameInp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) setName();
});
async function welcome() {
  renderSide();
  chat.innerHTML = "";
  await bot("안녕하세요, <b>" + esc(store.name) + "</b> 학생! 저는 소크라테스 선생님이에요. 🦉", 200);
  await bot("저는 정답을 바로 알려주지 않아요. 대신 <b>질문</b>을 할 거예요. 질문에 하나씩 답하다 보면 스스로 답에 도착하게 될 거예요.<br>막히면 <b>힌트 주세요</b>를 눌러도 좋아요.");
  await bot("어떤 유형부터 시작해 볼까요? (유형마다 20문항, 모두 80문항이에요)");
  setQuick(TYPES.map(T => ({ label: T.name, fn: () => { curType = T.id; nextUnsolvedIn(T.id); } })));
}
function nextUnsolvedIn(t) {
  for (let i = 0; i < 20; i++) {
    if (!store.res[t + "-" + i]) { startProblem(t, i); return; }
  }
  startProblem(t, 0);
}
function showResult() {
  let rows = "";
  let tot = { perfect: 0, hint: 0, shown: 0, none: 0 };
  TYPES.forEach(T => {
    const c = { perfect: 0, hint: 0, shown: 0, none: 0 };
    for (let i = 0; i < 20; i++) c[store.res[T.id + "-" + i] || "none"]++;
    Object.keys(c).forEach(k => { tot[k] += c[k]; });
    rows += "<tr><td>" + T.name + "</td><td>" + c.perfect + "</td><td>" + c.hint + "</td><td>" + c.shown + "</td><td>" + c.none + "</td></tr>";
  });
  rows += "<tr><th>합계</th><th>" + tot.perfect + "</th><th>" + tot.hint + "</th><th>" + tot.shown + "</th><th>" + tot.none + "</th></tr>";
  let weak = TYPES.map(T => {
    let s = 0;
    for (let i = 0; i < 20; i++) if (store.res[T.id + "-" + i] === "shown") s++;
    return { n: T.name, s: s };
  }).sort((a, b) => b.s - a.s)[0];
  const adv = weak && weak.s > 0 ? "<p>설명을 가장 많이 들은 유형은 <b>" + weak.n + "</b>이에요. 이 유형을 다시 풀어 보면 좋겠어요.</p>" : "<p>꾸준히 스스로 생각하고 있어요. 계속 도전해 봐요!</p>";
  document.getElementById("resBox").innerHTML =
    "<h2>" + esc(store.name || "") + " 학생의 학습 결과</h2>" +
    "<table><tr><th>유형</th><th>스스로</th><th>힌트 후</th><th>설명 들음</th><th>안 풂</th></tr>" + rows + "</table>" + adv +
    '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="window.print()">인쇄</button><button class="btn pri" onclick="document.getElementById(\'resOv\').classList.add(\'hide\')">닫기</button></div>';
  document.getElementById("resOv").classList.remove("hide");
}
function resetAll() {
  if (!confirm("모든 풀이 기록을 지울까요?")) return;
  store.res = {};
  save();
  cur = null;
  renderSide();
  welcome();
}

renderSide();
if (store.name) {
  document.getElementById("nameOv").classList.add("hide");
  welcome();
} else {
  document.getElementById("nameInp").focus();
}
</script>
</body>
